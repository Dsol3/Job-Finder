# ============================================================================
#  LEAD-WATCHING PROFILE — for the SEO closing script (docs/reddit-seo-closing-script.md)
#
#  Different job from config.example.toml. That one hunts *hiring* posts; this
#  one hunts people asking for help, which is where Stage 1 of the script opens.
#
#     py -m job_finder --config config.leads.toml --dry-run
#     py -m job_finder --config config.leads.toml --once
#
#  Separate storage on purpose: a post that matches BOTH profiles (e.g. someone
#  hiring an SEO writer) should still surface here.
# ============================================================================

[reddit]
subreddits = [
  "smallbusiness",       # the single best source of "my traffic dropped"
  "SEO",                 # technical audience; slow leads, strong credibility
  "Entrepreneur",
  "startups",
  "ecommerce",
  "juststart",           # site owners actively building
  "shopify",
  "bigseo",              # higher-level SEO discussion
]
limit = 100
max_age_hours = 24         # these posts stay warm longer than job posts
request_delay_sec = 2.0
poll_interval_sec = 600    # every 10 minutes is plenty for lead posts
user_agent = "script:job-finder:v1.0 (seo lead watcher)"

[matching]
# A lead post must contain at least one of these. Phrase them the way a
# non-marketer actually writes, not the way an SEO would.
include = [
  "traffic dropped",
  "traffic drop",
  "traffic has dropped",
  "lost traffic",
  "losing traffic",
  "traffic went down",
  "traffic is down",
  "traffic fell",
  "dropped in traffic",
  "rank on google",
  "ranking on google",
  "not showing up on google",
  "not indexed",
  "deindex",
  "no traffic",
  "why is my website not",
  "seo worth it",
  "is seo dead",
  "help with seo",
  "seo help",
  "need seo",
  "seo advice",
  "google search console",
  "rank my website",
  "get found on google",
  "appear on google",
]

# Pushes the post up the alert order — these are the ones worth answering first.
priority = [
  "traffic dropped", "lost traffic", "deindex", "not indexed",
  "google search console", "penalty",
]

boost = [
  "revenue", "customers", "leads", "clients", "sales",
  "months", "since", "budget", "paying", "agency", "quote",
  "shopify", "ecommerce", "local", "google business profile",
]

# Instant drop.
exclude = [
  # other people selling, not asking
  "for hire", "i do seo", "i offer", "my agency", "we offer", "seo services",
  "affordable seo", "cheap seo", "seo expert here", "dm me", "link in bio",
  # job-board traffic belongs in the other profile
  "hiring", "[hiring]",
  # junk and unqualified
  "unpaid", "revenue share", "equity", "free work",
  "crypto", "casino", "betting", "adult", "onlyfans", "gambling", "nft",
  "course", "mentorship", "coaching program", "webinar", "masterclass",
  "backlink package", "guest post service", "pbn",
  "student", "homework", "assignment",
]

[floors]
# Not used by this profile in practice (lead posts rarely name a budget), but
# keep the values sane so a post that does name a rate is judged fairly.
per_word = 0.05
per_hour = 15.0
per_article = 50.0
per_video = 50.0

[storage]
db_path = "leads.sqlite3"      # separate memory from the job profile
log_path = "leads.jsonl"
bootstrap = true

[notify]
channel = "auto"
telegram_token = ""
telegram_chat_id = ""
